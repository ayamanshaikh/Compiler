# ------------------------------------------------------------------------------
# CodeVista AI Backend - Application Properties
# ------------------------------------------------------------------------------
spring.application.name=codevista-backend
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration via Environment Variables
# No hardcoded credentials. Override via .env or system environment.
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codevista}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:codevista}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:codevista_secure_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP: resilient startup
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate (defaults to none for production resilience; set to update when DB is available)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ------------------------------------------------------------------------------
# CORS Configuration via Environment Variables
# ------------------------------------------------------------------------------
codevista.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# HTTP Compression & Performance Hardening
# ------------------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

