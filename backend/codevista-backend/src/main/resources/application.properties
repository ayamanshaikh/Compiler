spring.application.name=codevista-backend
server.port=8080

# ── Execution sandbox limits ──────────────────────────────────────────
# Subprocess timeouts (seconds) for compilation and program execution.
codevista.compilation.timeout-seconds=15
codevista.execution.timeout-seconds=10
# Maximum size of the submitted source code (characters).
codevista.execution.max-code-length=100000
# Maximum captured stdout/stderr per run (characters).
codevista.execution.max-output-length=131072
# Heap limit applied to the user program's JVM (javac -J-Xmx / java -Xmx).
codevista.execution.java-memory-limit=256m

# ── History ───────────────────────────────────────────────────────────
codevista.history.max-entries=50

# ── CORS ──────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. "*" is fine for local
# development; restrict this before any public deployment.
codevista.cors.allowed-origins=*